<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>시나모롤 캘린더 - 주현언니꼬!</title>
  <meta name="description" content="주현언니만을 위한 시나모롤 일정·회원 관리 캘린더">
  <meta name="theme-color" content="#BFE3F7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="주현언니꼬">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/app/icon-192.png">
  <link rel="apple-touch-icon" href="icons/app/apple-touch-icon.png">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <!-- 캘린더 탭 -->
    <main class="view view-calendar" data-view="calendar">
      <header class="topbar">
        <button type="button" class="title-btn" id="cal-title-btn" aria-label="년·월 선택">
          <img class="logo" src="icons/app/face.png" alt="">
          <span class="title-stack">
            <span class="title-line"><strong id="cal-title">2026년 10월</strong><svg class="chev" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span>
          </span>
        </button>
        <button type="button" class="icon-btn" id="more-btn" aria-label="더보기">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></svg>
        </button>
      </header>
      <div class="weekdays" aria-hidden="true">
        <span class="sun">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="sat">토</span>
      </div>
      <div class="cal-scroll" id="cal-scroll"></div>
    </main>

    <!-- 회원 탭 -->
    <main class="view view-members" data-view="members" hidden>
      <header class="topbar">
        <div class="title-btn static">
          <img class="logo" src="icons/app/hat.png" alt="">
          <span class="title-stack"><small id="member-count"></small><strong>회원</strong></span>
        </div>
        <button type="button" class="icon-btn" id="settings-btn" aria-label="설정">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8l1.6 2.3 2.7-.7.7 2.7 2.4 1.5-1.2 2.5 1.2 2.5-2.4 1.5-.7 2.7-2.7-.7L12 21.2l-1.6-2.4-2.7.7-.7-2.7-2.4-1.5 1.2-2.5-1.2-2.5 2.4-1.5.7-2.7 2.7.7z"/></svg>
        </button>
      </header>
      <div class="member-tools">
        <label class="search-box">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
          <input id="member-search" class="input" type="search" placeholder="이름 검색 (초성 OK)" autocomplete="off" aria-label="회원 검색">
        </label>
        <button type="button" class="btn primary" id="member-add">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>회원 등록</span>
        </button>
      </div>
      <ul class="member-list" id="member-list"></ul>
    </main>

    <!-- 집가고 싶다 -->
    <button type="button" class="home-fab" id="home-fab" aria-label="집가고 싶다 (선물)">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 10.5c-1.6-3.4-6.4-5.2-7.6-2.6-1 2.2 2.6 3 7.6 2.6zM16 10.5c1.6-3.4 6.4-5.2 7.6-2.6 1 2.2-2.6 3-7.6 2.6z" fill="#FFD1E0" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        <rect x="5" y="10.5" width="22" height="6" rx="2.5" fill="#FFFFFF" stroke="currentColor" stroke-width="1.8"/>
        <rect x="7" y="16.5" width="18" height="11" rx="3" fill="#FFFFFF" stroke="currentColor" stroke-width="1.8"/>
        <path d="M16 10.5v17" stroke="#7DB9E8" stroke-width="3.2"/>      </svg>
    </button>

    <!-- 하단 탭 -->
    <nav class="tabbar" role="tablist">
      <button type="button" class="tab on" data-tab="calendar" role="tab" aria-selected="true">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="4"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>
        <span>캘린더</span>
      </button>
      <button type="button" class="tab" data-tab="members" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.8 20c.7-3.6 3.2-5.6 6.2-5.6s5.5 2 6.2 5.6"/><circle cx="17.2" cy="9.5" r="2.6"/><path d="M16.6 14.6c2.6.2 4.3 2 4.8 5"/></svg>
        <span>회원</span>
      </button>
    </nav>
  </div>

  <div id="sheet-layer" class="sheet-layer"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/events.js"></script>
  <script src="js/members.js"></script>
  <script src="js/fun.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
